<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkiPlan AI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0a0f1e;
    color: #e8eaf0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-mountains {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      linear-gradient(180deg, #0a0f1e 0%, #0d1a35 40%, #112240 100%);
    z-index: 0;
  }

  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; height: 60%;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 20%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 5%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 18%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 10%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 35%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,0.4) 0%, transparent 100%);
    z-index: 0;
  }

  .mountain-svg {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 0;
    opacity: 0.4;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  header {
    text-align: center;
    padding: 3rem 0 2.5rem;
    animation: fadeDown 0.8s ease both;
  }

  .logo-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(99,179,237,0.12);
    border: 1px solid rgba(99,179,237,0.25);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #63b3ed;
    margin-bottom: 1.2rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 700;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 0.8rem;
  }

  h1 span {
    color: #63b3ed;
  }

  .subtitle {
    color: rgba(232,234,240,0.5);
    font-size: 1rem;
    font-weight: 300;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
    animation: fadeUp 0.6s ease both;
  }

  .card-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(232,234,240,0.4);
    margin-bottom: 0.75rem;
  }

  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 540px) {
    .input-row { grid-template-columns: 1fr; }
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-group label {
    font-size: 12px;
    color: rgba(232,234,240,0.5);
    font-weight: 500;
  }

  .input-group input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 0.75rem 1rem;
    color: #fff;
    font-size: 0.95rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .input-group input::placeholder { color: rgba(255,255,255,0.25); }
  .input-group input:focus {
    border-color: rgba(99,179,237,0.5);
    background: rgba(99,179,237,0.06);
  }

  .btn-plan {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 1rem;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 1.25rem;
    letter-spacing: 0.3px;
  }

  .btn-plan:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-plan:active { transform: scale(0.98); }
  .btn-plan:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 5px;
    margin-bottom: 1.25rem;
  }

  .tab {
    flex: 1;
    padding: 0.55rem 0.5rem;
    border: none;
    background: transparent;
    color: rgba(232,234,240,0.45);
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    text-align: center;
  }

  .tab.active {
    background: rgba(59,130,246,0.25);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,0.3);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .result-box {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 1.5rem;
    font-size: 0.92rem;
    line-height: 1.75;
    color: rgba(232,234,240,0.85);
    white-space: pre-wrap;
    min-height: 120px;
  }

  .weather-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }

  .weather-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 1rem;
    text-align: center;
  }

  .weather-card .date {
    font-size: 11px;
    color: rgba(232,234,240,0.4);
    margin-bottom: 6px;
  }

  .weather-card .temp {
    font-size: 1.5rem;
    font-weight: 500;
    color: #93c5fd;
    margin-bottom: 4px;
  }

  .weather-card .cond {
    font-size: 11px;
    color: rgba(232,234,240,0.55);
    text-transform: capitalize;
  }

  .weather-card .snow {
    font-size: 11px;
    color: #7dd3fc;
    margin-top: 4px;
  }

  .loading-dots {
    display: inline-flex;
    gap: 5px;
    align-items: center;
  }

  .loading-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #93c5fd;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(232,234,240,0.5);
    margin-bottom: 1rem;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
  }

  .empty-state {
    text-align: center;
    padding: 2rem;
    color: rgba(232,234,240,0.3);
    font-size: 0.88rem;
  }

  .empty-state .icon { font-size: 2rem; margin-bottom: 0.5rem; }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
</style>
</head>
<body>

<div class="bg-mountains"></div>
<div class="stars"></div>

<svg class="mountain-svg" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0,320 L0,200 L120,120 L200,160 L320,60 L420,130 L520,80 L600,110 L700,30 L800,100 L880,50 L960,120 L1040,70 L1120,140 L1220,90 L1320,160 L1440,110 L1440,320 Z" fill="rgba(255,255,255,0.03)"/>
  <path d="M0,320 L0,240 L180,170 L280,200 L380,140 L500,180 L600,130 L700,170 L800,120 L900,165 L1000,140 L1100,180 L1200,150 L1300,190 L1440,160 L1440,320 Z" fill="rgba(255,255,255,0.05)"/>
  <path d="M0,320 L0,280 L200,240 L400,260 L600,230 L800,255 L1000,235 L1200,260 L1440,240 L1440,320 Z" fill="rgba(255,255,255,0.07)"/>
</svg>

<div class="app">
  <header>
    <div class="logo-badge">❄ AI-Powered</div>
    <h1>Ski<span>Plan</span> AI</h1>
    <p class="subtitle">Your intelligent mountain trip planner</p>
  </header>

  <div class="card" style="animation-delay:0.05s">
    <p class="card-label">Plan your trip</p>
    <div class="input-row">
      <div class="input-group">
        <label>Where are you now?</label>
        <input type="text" id="from" placeholder="e.g. Ljubljana, Slovenia" />
      </div>
      <div class="input-group">
        <label>Where do you want to ski?</label>
        <input type="text" id="destination" placeholder="e.g. Zermatt, Switzerland" />
      </div>
    </div>
    <button class="btn-plan" id="planBtn" onclick="startPlanning()">🎿 Plan My Ski Trip</button>
  </div>

  <div class="card" id="resultsCard" style="animation-delay:0.15s; display:none;">
    <div class="status-row">
      <div class="status-dot"></div>
      <span id="statusText">Planning your trip...</span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('plan', this)">🗺 Trip Plan</button>
      <button class="tab" onclick="switchTab('weather', this)">🌨 Weather</button>
      <button class="tab" onclick="switchTab('hotels', this)">🏨 Hotels</button>
    </div>

    <div class="tab-panel active" id="tab-plan">
      <a id="maps-route" target="_blank" rel="noopener noreferrer" style="display:inline-block;color:#8be0ff;margin-bottom:12px">Open route in Google Maps</a>
      <div class="result-box" id="planResult">
        <div class="empty-state">
          <div class="icon">🎿</div>
          <p>Your AI trip plan will appear here...</p>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-weather">
      <div id="weatherResult">
        <div class="empty-state">
          <div class="icon">🌨</div>
          <p>Weather forecast will appear here...</p>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tab-hotels">
      <div class="result-box" id="hotelsResult">
        <div class="empty-state">
          <div class="icon">🏨</div>
          <p>Hotel recommendations will appear here...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const BACKEND = 'http://127.0.0.1:8000';

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function showLoading(elId) {
  document.getElementById(elId).innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:1rem;color:rgba(232,234,240,0.5);font-size:14px;">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      Loading...
    </div>`;
}

async function startPlanning() {
  const from = document.getElementById('from').value.trim();
  const dest = document.getElementById('destination').value.trim();

  if (!from || !dest) {
    alert('Please fill in both your starting location and ski destination!');
    return;
  }

  const btn = document.getElementById('planBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Planning...';
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

  const map = new URL('https://www.google.com/maps/dir/');
  map.search = new URLSearchParams({ api: '1', origin: from, destination: dest, travelmode: 'driving' });
  document.getElementById('maps-route').href = map.href;

  setStatus('Connecting to AI planner...');
  showLoading('planResult');
  showLoading('weatherResult');
  showLoading('hotelsResult');

  await Promise.all([
    fetchPlan(dest, from),
    fetchWeather(dest),
    fetchHotels(dest)
  ]);

  btn.disabled = false;
  btn.textContent = '🎿 Plan My Ski Trip';
  setStatus('Your trip is ready! ✅');
}

async function fetchPlan(dest, from) {
  try {
    const res = await fetch(`${BACKEND}/plan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ destination: dest, from_location: from })
    });
    const data = await res.json();
    document.getElementById('planResult').textContent = data.plan || 'No plan returned.';
  } catch (e) {
    document.getElementById('planResult').innerHTML = `
      <div style="color:#f87171;font-size:13px;">
        ⚠️ Could not connect to backend.<br>
        Make sure your Python server is running:<br><br>
        <code style="background:rgba(255,255,255,0.06);padding:4px 8px;border-radius:6px;font-size:12px;">
          uvicorn backend.main:app --reload
        </code>
      </div>`;
  }
}

async function fetchWeather(dest) {
  try {
    const res = await fetch(`${BACKEND}/weather/${encodeURIComponent(dest)}`);
    const data = await res.json();

    if (data.error || !data.forecasts) {
      document.getElementById('weatherResult').innerHTML = `<div class="empty-state"><p>Could not load weather for this location.</p></div>`;
      return;
    }

    const cards = data.forecasts.map(f => {
      const date = new Date(f.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const snow = f.snow > 0 ? `❄ ${f.snow.toFixed(1)}mm snow` : '';
      return `
        <div class="weather-card">
          <div class="date">${date}</div>
          <div class="temp">${Math.round(f.temp)}°C</div>
          <div class="cond">${f.condition}</div>
          ${snow ? `<div class="snow">${snow}</div>` : ''}
          <div style="font-size:11px;color:rgba(232,234,240,0.35);margin-top:4px;">💨 ${f.wind_speed.toFixed(1)} m/s</div>
        </div>`;
    }).join('');

    document.getElementById('weatherResult').innerHTML = `
      <div style="margin-bottom:1rem;font-size:13px;color:rgba(232,234,240,0.5);">5-day forecast for ${dest}</div>
      <div class="weather-grid">${cards}</div>`;
  } catch (e) {
    document.getElementById('weatherResult').innerHTML = `<div class="empty-state"><p>Weather unavailable — check backend connection.</p></div>`;
  }
}

async function fetchHotels(dest) {
  try {
    const res = await fetch(`${BACKEND}/hotels/${encodeURIComponent(dest)}`);
    const data = await res.json();
    document.getElementById('hotelsResult').textContent = data || 'No hotel data returned.';
  } catch (e) {
    document.getElementById('hotelsResult').innerHTML = `<div style="color:#f87171;font-size:13px;">⚠️ Could not load hotels. Check backend connection.</div>`;
  }
}
</script>
</body>
</html>
